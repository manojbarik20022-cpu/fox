[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fox2-clone"
version = "0.1.0"
description = "Open-source аналог программы Fox2 для автоматизации создания видео из сценария: текст → промты → озвучка → картинки → видео → сборка."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fox2-clone contributors" }]
keywords = ["video", "automation", "tts", "ai", "video-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "customtkinter>=5.2.2",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45.0", "playwright-stealth>=2.0.0"]
local-llm = ["ollama>=0.3.0"]
elevenlabs = ["elevenlabs>=1.0.0"]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.30.0"]
gemini = ["google-generativeai>=0.7.0"]
all = [
    "playwright>=1.45.0",
    "playwright-stealth>=2.0.0",
    "ollama>=0.3.0",
    "elevenlabs>=1.0.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
fox2 = "fox2.app:main"

[project.urls]
Homepage = "https://github.com/sagarjagtap20000-lang/fox2-clone"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    # Игнорим "неоднозначные unicode-символы" — проект на русском, кириллица в строках/доках это норма.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
